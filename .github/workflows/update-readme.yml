name: Update profile README

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - "projects.config.json"
      - "scripts/update-readme.mjs"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild projects, recent list and orbit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}   # optional, only needed for private repos
        run: node scripts/update-readme.mjs
      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: sync projects" && git push)
